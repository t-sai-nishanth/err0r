[project]
name = "bookerrror"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
	"ipython>=8.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=7.0",
]
llm = [
	"anthropic>=0.20",
	"openai>=1.0",
	"google-generativeai>=0.5",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
